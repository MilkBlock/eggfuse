[package]
name = "eggfuse-cell-runtime"
version = "0.1.0"
edition = "2024"

[features]
sparse-cells = ["iterative-bake"]
cell-absorption = ["sparse-cells"]
cell-entry-reverse = ["sparse-cells"]
storage-metrics = ["dep:libc"]
allocation-metrics = []
cell-query-sharing-audit = ["sparse-cells"]
entry-admission-audit = ["sparse-cells"]
completion-overlap-probes = []
keeper-proof = ["rhs-work-audit", "rhs-locals"]
rhs-locals = ["iterative-bake"]
rhs-work-audit = ["structural-depth"]
receipt-slots = ["structural-depth"]
structural-depth = ["iterative-bake"]
family-survey = []
family-scan = ["family-survey"]
family-port-trial = ["view-ports"]
family-frontiers = ["family-survey"]
family-overlap = ["family-survey"]
family-replay = ["family-survey"]
view-storage = []
view-consumers = ["view-storage"]
view-ports = ["view-consumers"]
projection-survey = []
projection-stamps = []
projection-semijoin = []
projection-shared = []
default = ["iterative-bake"]
slot-transfer-audit = []
spine-shapes = []
spine-blocks = []
iterative-bake = ["spine-blocks"]

[dependencies]
libc = { version = "0.2", optional = true }
eggfuse-structural-key = { path = "../structural-key" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
smallvec = { version = "1", features = ["union"] }
rustc-hash = "2.1"
rayon = "1"
mimalloc = { version = "0.1", default-features = false }

[[example]]
name = "bake_spine_blocks"
required-features = ["spine-blocks"]


[[example]]
name = "complete_blocks"
required-features = ["iterative-bake"]

[[example]]
name = "cell_state_allocations"
required-features = ["sparse-cells"]

[[example]]
name = "rank_families"
required-features = ["family-survey"]

[[example]]
name = "rank_rhs_work"
required-features = ["rhs-work-audit", "rhs-locals"]

[[example]]
name = "cell_change_windows"
required-features = ["sparse-cells", "slot-transfer-audit"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ripsat-view"
version = "0.2.2"
description = "Offline RipSat Bake catalog viewer"
requires-python = ">=3.8"

[project.scripts]
ripsat-view = "ripsat_view.__main__:main"

[tool.setuptools.package-data]
ripsat_view = ["viewer.html", "egraph.html"]

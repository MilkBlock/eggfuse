<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RipSat · E-graph</title>
<style>*{box-sizing:border-box}body{margin:0;font:15px/1.6 -apple-system,sans-serif;color:#183c34;background:#f5f6f2}header{padding:14px 24px;background:#163b34;color:white;display:flex;align-items:center;gap:20px}header strong{font-size:23px}select,input,button{font:inherit;padding:4px 8px;color:#163b34;background:white;border:1px solid #b1c4ba;border-radius:5px}button{cursor:pointer}main{padding:16px 24px}nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px}input{width:9em}#graph{height:70vh;overflow:auto;background:white;border:1px solid #c8d5cf;border-radius:7px}svg{display:block}#desc{margin:10px 0}p{color:#4f675c}aside{font:13px/1.6 monospace}</style>
<header><strong>RipSat · E-graph</strong><a href="/stream" style="color:white">Token 执行流</a><select id="lib" aria-label="目录"></select></header><main><nav><button id="prev">上一项</button><label>Cell <input id="idx" type="number" min="0" value="0"></label><span id="total"></span><button id="next">下一项</button><button id="random">随机抽看</button><select id="phase" aria-label="快照阶段"><option value="after">Ripen 后</option><option value="before">入口快照</option></select><button id="minus">缩小</button><button id="plus">放大</button><button id="fit">适应窗口</button></nav><div id="desc"></div><div id="graph"></div><aside id="notes"></aside><p>虚线框是等价类，框内是产生该值的算子。箭头指向参数所在的类，数字是参数位置。黄色节点为 RipenInput。IntParam 表示整数参数；共用参数的边指向同一等价类。</p></main>
<script>const libs=/*LIBRARIES*/, $=id=>document.getElementById(id);libs.forEach((l,i)=>$('lib').add(new Option(l.name+' · '+l.mode,i)));
let gen=0,scale=1;function size(fit=false){const s=$('graph').querySelector('svg');if(!s)return;const box=s.viewBox.baseVal;if(fit)scale=Math.min(($('graph').clientWidth-4)/box.width,($('graph').clientHeight-4)/box.height);s.style.width=box.width*scale+'px';s.style.height=box.height*scale+'px'}
async function show(){const serial=++gen,k=+$('lib').value,l=libs[k],i=Math.min(l.count-1,Math.max(0,Math.floor(+$('idx').value)||0));$('idx').value=i;$('idx').max=l.count-1;$('total').textContent='/ '+(l.count-1);$('prev').disabled=!i;$('next').disabled=i===l.count-1;$('phase').hidden=!l.names;$('desc').textContent=l.names?l.names[i]+' · '+$('phase').selectedOptions[0].text:'条件成立时的规则等式 · RipenInput(外部端口, 字段列) 为符号边界；运行时事实存在性、guard 和合并结果仍需核验。';$('graph').textContent='正在排布等价类…';$('notes').textContent='';history.replaceState(null,'','#'+k+'/'+i+'/'+$('phase').value);try{const r=await fetch('/graph/'+k+'/'+i+'/'+$('phase').value);if(!r.ok)throw Error(r.statusText);const d=await r.json();if(serial!==gen)return;$('graph').innerHTML=d.svg;$('notes').textContent=d.notes.length?'其他执行操作 · '+d.notes.join(' / '):'';size(true)}catch(e){if(serial===gen)$('graph').textContent='无法读取此图 · '+e.message}}
$('lib').onchange=()=>{$('idx').value=0;show()};$('idx').onchange=$('phase').onchange=show;$('prev').onclick=()=>{$('idx').stepDown();show()};$('next').onclick=()=>{$('idx').stepUp();show()};$('random').onclick=()=>{$('idx').value=Math.floor(Math.random()*libs[+$('lib').value].count);show()};$('minus').onclick=()=>{scale/=1.35;size()};$('plus').onclick=()=>{scale*=1.35;size()};$('fit').onclick=()=>size(true);const h=location.hash.slice(1).split('/');if(libs[+h[0]]){$('lib').value=+h[0];$('idx').value=+h[1]||0;if(h[2]==='before')$('phase').value='before'}show()</script></html>

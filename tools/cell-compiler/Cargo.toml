[package]
name = "eggfuse-cell-compiler"
version = "0.1.0"
edition = "2024"

[dependencies]
eggfuse-bake = { path = "../.." }
egglog = { path = "../../egglog", default-features = false, features = ["graphviz", "serde"] }
eggfuse-cell-runtime = { path = "../../engine/cell-runtime" }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
microlp = "0.7.0"

[[bench]]
name = "cell"
harness = false

[features]
storage-metrics = ["eggfuse-cell-runtime/storage-metrics"]
parallel-publication = ["parallel-residuals", "eggfuse-cell-runtime/parallel-publication"]
parallel-residuals = ["sparse-cells", "eggfuse-cell-runtime/parallel-residuals"]
completion-overlap-probes = ["eggfuse-cell-runtime/completion-overlap-probes"]
sparse-cells = ["eggfuse-cell-runtime/sparse-cells"]
cell-absorption = ["sparse-cells", "eggfuse-cell-runtime/cell-absorption"]
cell-entry-reverse = ["sparse-cells", "eggfuse-cell-runtime/cell-entry-reverse"]
parallel-entry-filters = ["sparse-cells", "eggfuse-cell-runtime/parallel-entry-filters"]
rhs-locals = ["eggfuse-cell-runtime/rhs-locals"]
receipt-slots = ["structural-depth","eggfuse-cell-runtime/receipt-slots"]
structural-depth = ["eggfuse-cell-runtime/structural-depth"]
view-storage = ["eggfuse-cell-runtime/view-storage"]
view-consumers = ["view-storage", "eggfuse-cell-runtime/view-consumers"]
view-ports = ["view-consumers", "eggfuse-cell-runtime/view-ports"]
iterative-bake = ["eggfuse-cell-runtime/iterative-bake","eggfuse-cell-runtime/slot-transfer-audit"]

[[example]]
name = "emit_worker_handoff"
required-features = ["iterative-bake"]

[[example]]
name = "inspect_cell_catalog"
required-features = ["iterative-bake"]

[[example]]
name = "emit_lazy_union"
required-features = ["iterative-bake"]

[[example]]
name = "runtime_storage_census"
required-features = ["sparse-cells", "storage-metrics"]

[[example]]
name = "runtime_storage_comparison"
required-features = ["iterative-bake", "sparse-cells", "storage-metrics"]
